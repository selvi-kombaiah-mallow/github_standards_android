name: Apply Branch PR Template

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

permissions:
  pull-requests: write
  contents: read

jobs:
  update-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Apply Template
        uses: actions/github-script@v7
        with:
          script: |

            const action = context.payload.action;

            // Only true when base branch changes
            const baseChanged =
              context.payload.changes &&
              context.payload.changes.base;

            // Run only for:
            // 1. New PR
            // 2. Reopened PR
            // 3. Target branch changed

            if (
              action !== 'opened' &&
              action !== 'reopened' &&
              !baseChanged
            ) {

              console.log(
                'Skipping template update - PR content edited but target branch unchanged.'
              );

              return;
            }

            const targetBranch =
              context.payload.pull_request.base.ref;

            let templatePath = '';

            if (targetBranch === 'development') {

              templatePath =
                '.github/PULL_REQUEST_TEMPLATE/development.md';

            } else if (
              targetBranch.startsWith('release/')
            ) {

              templatePath =
                '.github/PULL_REQUEST_TEMPLATE/release.md';

            } else if (
              targetBranch === 'main'
            ) {

              templatePath =
                '.github/PULL_REQUEST_TEMPLATE/main.md';

            } else {

              console.log(
                `No template configured for branch: ${targetBranch}`
              );

              return;
            }

            console.log(
              `Applying template ${templatePath} for ${targetBranch}`
            );

            const file =
              await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: templatePath,
                ref: 'main'
              });

            const templateBody =
              Buffer.from(
                file.data.content,
                'base64'
              ).toString('utf8');

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number:
                context.payload.pull_request.number,
              body: templateBody
            });

            console.log(
              `Applied template: ${templatePath}`
            );
